# DevBox CI. One required job, "verify", runs the same gates as `devbox verify` locally,
# read from .devbox/config so local and CI never drift.
# Actions are pinned to full commit SHAs (OpenSSF Scorecard: Pinned-Dependencies); Dependabot bumps them.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Publish-safety scan of the working tree and full history, secrets only (CI has no private terms
      # list and is not the user's box). Dependency-free, so it runs before npm ci runs any install script.
      - name: Publish-safety scan (secrets)
        run: node scripts/publish-scan.mjs --ci
      # Interim until the 007 installer provides ffmpeg; strace backs the offline test.
      - name: Install ffmpeg and strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg strace
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome headless shell
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Verify gates
        run: .devbox/bin/devbox verify
