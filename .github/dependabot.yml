version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Bumped by hand together with the Chrome headless shell revision it downloads.
      - dependency-name: "playwright-core"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
